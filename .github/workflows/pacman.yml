name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate pacman contribution graph
        uses: Kefranabg/pacman-contribution-graph-action@v1
        with:
          github_user_name: Lakshya2006178
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_dark_path: dist/pacman-contribution-graph-dark.svg
          output_light_path: dist/pacman-contribution-graph.svg

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
